# YourWalk score-aware challenger (Casey graph). See docs/HOSTING_CHALLENGER.md
#
# First-time: fly auth login, then fly launch --no-deploy --copy-config
# (or fly apps create yourwalk-challenger --org personal). Then fly deploy.

app = "yourwalk-challenger"
primary_region = "syd"

[build]
  dockerfile = "pipeline/bakeoff/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 120

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
