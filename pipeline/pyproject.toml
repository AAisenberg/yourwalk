[project]
name = "yourwalk-pipeline"
version = "0.1.0"
description = "YourWalk Phase B data pipeline — City of Casey pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2.0",
    "httpx>=0.28.0",
    "pyarrow>=19.0.0",
    "geopandas>=1.0.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.15.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.9.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yourwalk_pipeline*"]
